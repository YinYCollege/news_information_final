[project]
name = "news-information-final"
version = "0.1.0"
description = "A program that displays news from around the world"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyside6>=6.12.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
news-information-final = "news_information_final:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
